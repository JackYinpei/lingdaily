# Tokyo relay for client-side BYOK connections (Google Gemini + OpenAI).
# Supports both HTTP (REST / streaming) and WebSocket (Gemini Live & OpenAI Realtime).
# Logging is disabled on every location because requests carry user-supplied API keys.

server {
    listen 80;
    server_name lingdailyapi.yasobi.xyz lingdailyapi-jp.yasobi.xyz;

    access_log off;
    error_log /dev/null;

    # ---- Google Gemini Live WebSocket ----
    location /ws/ {
        proxy_pass https://generativelanguage.googleapis.com;
        proxy_set_header Host generativelanguage.googleapis.com;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- OpenAI via /openai prefix (e.g. Base URL: https://lingdailyapi-jp.yasobi.xyz/openai) ----
    location = /openai/v1/realtime {
        rewrite ^/openai(/.*)$ $1 break;
        proxy_pass https://api.openai.com;
        proxy_set_header Host api.openai.com;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
    }

    location /openai/ {
        rewrite ^/openai(/.*)$ $1 break;
        proxy_pass https://api.openai.com;
        proxy_set_header Host api.openai.com;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        client_max_body_size 25m;
    }

    # ---- OpenAI direct paths (also works when Base URL omits /openai). Gemini clients use /v1beta, so /v1/models is OpenAI here. ----
    location = /v1/realtime {
        proxy_pass https://api.openai.com;
        proxy_set_header Host api.openai.com;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
    }

    location ~ ^/v1/(chat|audio|responses|models)(/|$) {
        proxy_pass https://api.openai.com;
        proxy_set_header Host api.openai.com;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        client_max_body_size 25m;
    }

    # ---- Google Gemini REST (/v1beta/*, /v1alpha/*, etc.) ----
    location / {
        proxy_pass https://generativelanguage.googleapis.com;
        proxy_set_header Host generativelanguage.googleapis.com;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        client_max_body_size 25m;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
