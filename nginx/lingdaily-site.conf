# Reference config for the main site (lingdaily.yasobi.xyz -> Next.js on :8000).
# Network tuning for readers in mainland China reaching Tokyo; it changes no
# application behaviour. Merge into the live server block (keep its certbot
# certificate lines), then `nginx -t` before `systemctl reload nginx`.
#
# Measured 2026-11-03 before this config: the site answered over HTTP/1.1 only,
# and JSON API responses (iOS sync snapshot, scenario catalog, history lists)
# were sent uncompressed, because Ubuntu's default nginx gzips only text/html.

upstream lingdaily_app {
    server 127.0.0.1:8000;
    # Reuse connections to Next.js instead of opening one per request.
    keepalive 32;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name lingdaily.yasobi.xyz;

    # ssl_certificate / ssl_certificate_key: keep the existing certbot lines.
    ssl_protocols TLSv1.2 TLSv1.3;
    # Returning visitors resume TLS instead of a full handshake (one round trip saved).
    ssl_session_cache shared:LingDailySSL:20m;
    ssl_session_timeout 1d;
    ssl_session_tickets on;

    keepalive_timeout 75s;
    keepalive_requests 1000;

    gzip on;
    gzip_vary on;
    # Also compress responses requested through proxies/CDNs (they send Via).
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        application/json
        application/xml
        application/rss+xml
        application/javascript
        text/css
        text/plain
        text/xml
        image/svg+xml;

    # /api/ios/sync accepts up to 4 MB per request; the nginx default is 1 MB.
    client_max_body_size 8m;

    location / {
        proxy_pass http://lingdaily_app;
        proxy_http_version 1.1;
        # Empty Connection keeps the upstream keepalive pool in use.
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        # Keep whatever proxy_buffering the live config already uses.
    }

    # Podcast generation is triggered by the server crontab and runs long
    # (see docs/gemini38-tts.md); keep its timeouts as configured there.
    location = /api/podcast/generate {
        proxy_pass http://lingdaily_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 7500s;
        proxy_send_timeout 7500s;
    }

    # Hashed build assets never change; Next already sends immutable headers.
    location /_next/static/ {
        proxy_pass http://lingdaily_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        access_log off;
    }
}
